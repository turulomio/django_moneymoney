name: Docker Image CI

on:
  workflow_run:
    workflows: ["Django CI"] # Se ejecuta tras completar el workflow django.yml en main
    types:
      - completed
    branches: [ "main" ]
  push:
    branches: [ "266-fix-docker-errors" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      id: build_image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/django_moneymoney:latest
        file: ./Dockerfile

  check_api:
    needs: [build_and_publish]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate docker-compose test file
      run: |
        cat << 'EOF' > docker-compose.test.yml
        version: '3.8'
        services:
          db:
            image: postgres:16.4
            environment:
              POSTGRES_DB: xulpymoney
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
            ports:
              - "5432:5432"

          web:
            image: ${{ secrets.DOCKER_USERNAME }}/django_moneymoney:latest
            environment:
              POSTGRES_HOST: db
              POSTGRES_PORT: 5432
              POSTGRES_DB: xulpymoney
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
            ports:
              - "8000:8000"
            depends_on:
              - db
        EOF

    - name: Start PostgreSQL Service
      run: |
        docker compose -f docker-compose.test.yml up -d db

    - name: Install PL/Python Extension in PostgreSQL
      run: |
        until docker compose -f docker-compose.test.yml exec -T db pg_isready -U postgres -d xulpymoney; do
          echo "Waiting for PostgreSQL to become ready..."
          sleep 2
        done
        docker compose -f docker-compose.test.yml exec -T db bash -c "apt-get update && apt-get install -y postgresql-plpython3-16"
        docker compose -f docker-compose.test.yml exec -T db psql -U postgres -d xulpymoney -c "CREATE EXTENSION IF NOT EXISTS plpython3u;"

    - name: Start Web Container and Run Migrations
      run: |
        docker compose -f docker-compose.test.yml up -d web
        docker compose -f docker-compose.test.yml exec -T web python manage.py migrate

    - name: Verify Web Service Health
      run: |
        for i in $(seq 1 30); do
          if curl -s http://localhost:8000/ > /dev/null 2>&1; then
            echo "Django app is ready and responding!"
            exit 0
          fi
          echo "Waiting for Django app... ($i/30)"
          sleep 2
        done
        echo "Django app failed to respond on port 8000"
        docker compose -f docker-compose.test.yml logs
        exit 1

    - name: Clean up Docker Compose services
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down --volumes