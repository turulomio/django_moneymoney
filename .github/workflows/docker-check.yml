name: Docker Image Check

on:
  workflow_run:
    workflows: ["Docker Image CI"] # Nombre del workflow de publicación (docker-publish.yml)
    types:
      - completed # Se ejecuta cuando el workflow de publicación ha terminado
    branches: [ "main", "266-fix-docker-errors" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_api:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Download image tag artifact
      if: ${{ github.event_name == 'workflow_run' }}
      uses: actions/download-artifact@v4
      with:
        name: image-tag
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: .

    - name: Resolve Docker Image Tag
      run: |
        DEFAULT_TAG="${{ secrets.DOCKER_USERNAME }}/django_moneymoney:latest"
        DOCKER_IMAGE_TAG="$DEFAULT_TAG"

        if [ -f image_tag.txt ]; then
          CANDIDATE_TAG="$(head -n 1 image_tag.txt | tr -d '\r\n')"
          if [ -n "$CANDIDATE_TAG" ]; then
            DOCKER_IMAGE_TAG="$CANDIDATE_TAG"
          fi
        fi

        echo "Testing with Docker image tag: $DOCKER_IMAGE_TAG"
        echo "DOCKER_IMAGE_TAG=$DOCKER_IMAGE_TAG" >> "$GITHUB_ENV"

    - name: Generate docker-compose test file
      run: |
        cat << 'EOF' > docker-compose.test.yml
        version: '3.8'
        services:
          db:
            image: postgres:16.4
            environment:
              POSTGRES_DB: xulpymoney
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
            ports:
              - "5432:5432"

          web:
            image: ${DOCKER_IMAGE_TAG}
            environment:
              POSTGRES_HOST: db
              POSTGRES_PORT: 5432
              POSTGRES_DB: xulpymoney
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
            ports:
              - "8000:8000"
            depends_on:
              - db
        EOF

    - name: Start PostgreSQL Service
      run: |
        docker compose -f docker-compose.test.yml up -d db

    - name: Install PL/Python Extension in PostgreSQL
      run: |
        until docker compose -f docker-compose.test.yml exec -T db pg_isready -U postgres -d xulpymoney; do
          echo "Waiting for PostgreSQL to become ready..."
          sleep 2
        done
        docker compose -f docker-compose.test.yml exec -T db bash -c "apt-get update && apt-get install -y postgresql-plpython3-16"
        docker compose -f docker-compose.test.yml exec -T db psql -U postgres -d xulpymoney -c "CREATE EXTENSION IF NOT EXISTS plpython3u;"

    - name: Start Web Container and Run Migrations
      run: |
        docker compose -f docker-compose.test.yml up -d web
        docker compose -f docker-compose.test.yml exec -T web python manage.py migrate

    - name: Verify Web Service Health
      run: |
        for i in $(seq 1 30); do
          if curl -s http://localhost:8000/ > /dev/null 2>&1; then
            echo "Django app is ready and responding!"
            exit 0
          fi
          echo "Waiting for Django app... ($i/30)"
          sleep 2
        done
        echo "Django app failed to respond on port 8000"
        docker compose -f docker-compose.test.yml logs
        exit 1

    - name: Clean up Docker Compose services
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down --volumes